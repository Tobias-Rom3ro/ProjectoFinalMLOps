name: Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-llm:
    name: Pruebas LLM Connector
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Instalar dependencias
        working-directory: ./llm_connector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas
        working-directory: ./llm_connector
        env:
          GENAI_API_KEY: test-key-for-ci
          SERVICE_NAME: llm_connector
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v --tb=short

  test-sklearn:
    name: Pruebas Sklearn Model
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Instalar dependencias
        working-directory: ./sklearn_model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas
        working-directory: ./sklearn_model
        env:
          SERVICE_NAME: sklearn_model
          LOG_LEVEL: ERROR
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          pytest tests/ -v --tb=short

  test-cnn:
    name: Pruebas CNN Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Instalar dependencias
        working-directory: ./cnn_image
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas
        working-directory: ./cnn_image
        env:
          SERVICE_NAME: cnn_image
          LOG_LEVEL: ERROR
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          pytest tests/ -v --tb=short

  test-gradio:
    name: Pruebas Gradio Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Instalar dependencias
        working-directory: ./gradio_frontend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas
        working-directory: ./gradio_frontend
        env:
          SERVICE_NAME: gradio_frontend
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v --tb=short